name: "Deploy Frontend (Angular + nginx)"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      runner-tag:
        description: "Etiqueta específica del runner (ej. develop o production)"
        required: true
        type: string
      deploy-dir:
        description: "Ruta absoluta donde nginx sirve los archivos estáticos"
        required: true
        type: string
      environment-name:
        description: "Nombre del GitHub Environment (ej. development o production)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: "Desplegar Frontend (${{ inputs.environment-name }})"
    # GitHub Actions exige que el runner tenga TODAS las etiquetas de la lista.
    # Esto garantiza aislamiento total entre desarrollotrans y Fundea_pro.
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner-tag }}"]
    environment: ${{ inputs.environment-name }}
    env:
      DEPLOY_DIR: ${{ inputs.deploy-dir }}
      DIST_DIR: dist/app-hvc-kapital
    steps:
      # ──────────────────────────────────────────────────────
      # NOTA: No se verifican comandos de nginx (nginx -t,
      # systemctl reload nginx) debido a que el runner de
      # GitHub Actions no tiene permisos sudo en el servidor
      # por razones de seguridad. Si se requiere verificar
      # o recargar nginx, se debe hacer manualmente en el
      # servidor o configurar sudoers para el usuario del runner.
      # ──────────────────────────────────────────────────────

      - name: Checkout del repositorio Frontend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Generar environment.prod.ts con Secrets de GitHub
        run: |
          mkdir -p src/environments
          API_URL="${{ secrets.FUNDEA_DEV_API_URL }}"
          API_PREFIX="${{ secrets.FUNDEA_DEV_PREFIX }}"

          # Crea o sobrescribe el archivo de producción usando los secrets
          cat <<EOF > src/environments/environment.prod.ts
          export const environment = {
              production: true,
              path: '${API_URL}',
              apiPath: '${API_URL}${API_PREFIX}',
              tokenCheckInterval: 5, // minutos
              diasAtrasMovimientos: 1,
          };
          EOF

      - name: Compilar Angular (build)
        run: npx ng build --configuration=production

      - name: Verificar que el build generó los archivos estáticos
        run: |
          # El builder @angular/build:application deja los estáticos en
          # dist/<nombre-proyecto>/browser/, NO en dist/ directamente.
          if [ ! -f "${DIST_DIR}/browser/index.html" ]; then
            echo "❌ No se encontró ${DIST_DIR}/browser/index.html. El build falló."
            echo "Contenido de dist/:"
            ls -R dist 2>/dev/null || echo "  (dist/ no existe)"
            exit 1
          fi
          echo "✅ Build exitoso — ${DIST_DIR}/browser/index.html encontrado."

      - name: Sincronizar frontend al directorio de nginx
        run: |
          echo "📂 Sincronizando frontend a ${DEPLOY_DIR}..."
          mkdir -p "${DEPLOY_DIR}"
          # --delete limpia los bundles con hash de despliegues anteriores.
          # Su alcance queda limitado al directorio que sirve nginx.
          rsync -av --delete "./${DIST_DIR}/browser/" "${DEPLOY_DIR}/"

      - name: Frontend desplegado exitosamente
        run: |
          echo "✅ Frontend desplegado en ${DEPLOY_DIR}."
          echo "ℹ️  Nota: nginx no se recarga automáticamente desde el workflow."
          echo "   Para recargar nginx, ejecutar en el servidor:"
          echo "   sudo systemctl reload nginx"
