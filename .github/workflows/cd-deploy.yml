name: "CD Develop - Pipeline (Frontend)"

on:
  push:
    branches: [ "develop" ]

jobs:
  # 1. Mandar a llamar al flujo de seguridad
  ejecutar-seguridad:
    name: "Validaciones de Seguridad"
    uses: ./.github/workflows/security-scan.yml

  # 2. Si el escaneo es exitoso, proceder con el despliegue del Frontend
  desplegar-frontend:
    name: "Despliegue del Frontend"
    needs: ejecutar-seguridad
    uses: ./.github/workflows/deploy-frontend.yml