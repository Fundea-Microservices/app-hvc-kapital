name: "DevSecOps Security Scan"

on:
  pull_request:
    branches: [ "develop", "production", "certification" ]
  push:
    branches: [ "develop", "production", "certification" ]
  workflow_call: 

permissions:
  contents: read

jobs:
  sast-scan:
    name: "Análisis Estático de Código (SAST)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Ejecutar Escaneo SAST (JSON)
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=auto \
            --json --output=semgrep-results.json \
            --exclude="onesiteapp_ex-ms/dist" \
            --exclude="onesiteapp_ex/build" \
            --error

      - name: Mostrar resumen legible en el log
        if: always()
        run: |
          echo "## Hallazgos Semgrep" >> $GITHUB_STEP_SUMMARY
          if [ -f semgrep-results.json ]; then
            RESULTS_COUNT=$(jq '.results | length' semgrep-results.json)
            ERRORS_COUNT=$(jq '.errors | length' semgrep-results.json)

            echo "📊 Resultados: ${RESULTS_COUNT} findings | ${ERRORS_COUNT} errores/timeouts en Semgrep"
            echo "- Findings en \`.results\`: **${RESULTS_COUNT}**" >> $GITHUB_STEP_SUMMARY
            echo "- Errores/timeouts en \`.errors\`: **${ERRORS_COUNT}**" >> $GITHUB_STEP_SUMMARY

            if [ "$RESULTS_COUNT" -gt 0 ]; then
              jq -r '.results[] | "- [\(.extra.severity)] **\(.check_id)** en `\(.path):\(.start.line)` — \(.extra.message)"' \
                semgrep-results.json | tee -a $GITHUB_STEP_SUMMARY
            fi

            if [ "$ERRORS_COUNT" -gt 0 ]; then
              echo "### Errores o timeouts de Semgrep" >> $GITHUB_STEP_SUMMARY
              jq -r '.errors[] | "- [code \(.code) / \(.level)] en `\(.path // "general")` (\(.rule_id // "sin-regla")): \(.message)"' \
                semgrep-results.json | tee -a $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No se encontró semgrep-results.json"
            echo "⚠️ No se generó semgrep-results.json." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar resultados SAST (JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: semgrep-sast-results
          path: semgrep-results.json

      - name: Fallar el job si hubo findings bloqueantes
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "❌ El paso 'Ejecutar Escaneo SAST (JSON)' falló."
          if [ -f semgrep-results.json ]; then
            echo "Detalle rápido del JSON:"
            jq '{
              results_count: (.results | length),
              errors_count: (.errors | length),
              findings: [.results[] | {severity: .extra.severity, check_id: .check_id, path: .path, line: .start.line}],
              errors: [.errors[] | {code: .code, level: .level, path: .path, rule_id: .rule_id, message: .message}]
            }' semgrep-results.json
          fi
          exit 1

  sca-scan:
    name: "Análisis de Dependencias Terceras (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Ejecutar Escaneo SCA (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'