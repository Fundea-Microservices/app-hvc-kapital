<header class="flex w-full justify-between items-center px-4 py-2" style="background-color: var(--navbar-bg);">
   

        <div class="flex  justify-between items-center lg:hidden ">
            <h1 class="ml-6 text-xl font-semibold m-4" style="color: var(--navbar-text);">Admin</h1>
            <button
                type="button"
                (click)="optenToggleSidebar()"
                class="navbar-toggle inline-flex items-center justify-center p-2 rounded-lg focus:outline-none focus:ring-2"
                aria-label="Abrir menú principal"
                >
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                    <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M1 1h15M1 7h15M1 13h15"
                    />
                </svg>
            </button>
        </div>

        <!-- User -->
        <div class="flex flex-shrink-0 ml-auto">
       
           <!-- User Dropdown -->
            <div class="hs-dropdown relative inline-flex w-full">
                <button id="hs-dropdown-user" type="button"
                    class="hs-dropdown-toggle navbar-user-btn w-full flex items-center gap-x-3 py-2 px-3 text-sm bg-transparent rounded-sm focus:outline-none
                    disabled:opacity-50 disabled:pointer-events-none"
                    aria-haspopup="menu" aria-expanded="false" aria-label="Dropdown">
                    <img class="shrink-0 size-8 rounded-full ring-2" style="ring-color: var(--hvc-accent-orange);"
                        [src]="user().fotoUrl || 'images/user-default.png'"
                        alt="Avatar">
                    <div class="text-left">
                        <div class="font-medium" style="color: var(--navbar-text);">{{user().nombre1}} {{user().apellido1}}</div>
                        <div class="text-xs" style="color: var(--navbar-text-secondary);">{{user().rol?.nombre || 'Sin rol'}}</div>
                        @if (user().sucursal) {
                        <div class="text-xs font-semibold" style="color: var(--hvc-accent-orange);">{{ user().sucursal!.nombre | uppercase }}</div>
                        }
                    </div>
                    <svg class="hs-dropdown-open:rotate-180 shrink-0 size-4 ml-auto transition-transform duration-200"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 w-60 hidden z-10 bg-white shadow-md rounded-lg"
                    style="color: var(--hvc-primary-dark);"
                    role="menu" aria-orientation="vertical" aria-labelledby="hs-dropdown-user">

                    <!-- Perfil Section -->
                    <div class="py-3 px-4 ">
                        <div class="flex items-center gap-x-3">
                            <img class="shrink-0 size-10 rounded-full"
                                [src]="user().fotoUrl || 'images/user-default.png'"
                                alt="Avatar">
                            <div>
                                <div class="font-medium">{{user().nombre1}} {{user().apellido1}}</div>
                                <div class="text-xs" style="color: var(--hvc-gray);">{{user().userName}}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Configuración de Cuenta -->
                    <div class="py-2">
                        <a class="navbar-dropdown-item flex items-center gap-x-3 py-2 px-4 text-sm"
                            role="menuitem" (click)="openProfile($event)">
                            <app-custom-icon [name]="'circle-user'" [color]="'var(--hvc-primary-dark)'"></app-custom-icon>
                            Mi Perfil
                        </a>

                        <a class="navbar-dropdown-item flex items-center gap-x-3 py-2 px-4 text-sm"
                            href="#" role="menuitem">
                            <app-custom-icon [name]="'cog'" [color]="'var(--hvc-primary-dark)'"></app-custom-icon>
                            Configuración
                        </a>
                    </div>

                    <!-- Cerrar Sesión -->
                    <div class="py-2 ">
                        <a class="navbar-dropdown-item--danger flex items-center gap-x-3 py-2 px-4 text-sm"
                            href="#" role="menuitem" (click)="logout()">
                            <app-custom-icon [name]="'log-out'" [color]="'var(--hvc-danger)'"></app-custom-icon>
                            Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>

         
        </div>
    

</header>
