<form [formGroup]="form()" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Nombre -->
  <div>
    <label class="block text-sm font-medium mb-1" style="color: var(--text)">Nombre</label>
    <input
      type="text"
      formControlName="nombre"
      class="input-control"
      style="border-color: var(--hvc-primary-light)"
    />

    @if (form().get('nombre')?.touched && form().get('nombre')?.invalid) {
      <div class="text-sm mt-1 space-y-1" style="color: var(--hvc-danger)">
        @if (form().get('nombre')?.errors?.['required']) {
          <div>Nombre es requerido</div>
        }
        @if (form().get('nombre')?.errors?.['minlength']) {
          <div>Mínimo 3 caracteres</div>
        }
      </div>
    }
  </div>

  <!-- Switches -->
  <div class="grid grid-cols-2 gap-4">
    <div class="flex items-center">
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          formControlName="activo"
          class="sr-only peer"
        />
        <div
          class="w-11 h-6 peer-focus:outline-none peer-focus:ring-2 rounded-full transition-colors"
          style="background-color: var(--hvc-gray-light); --tw-ring-color: var(--hvc-primary)"
        ></div>
        <div
          class="absolute top-1/2 left-0.5 -translate-y-1/2 w-5 h-5 bg-white rounded-full shadow-md transition-transform peer-checked:translate-x-5"
        ></div>
        <span class="ml-3 text-sm font-medium" style="color: var(--text)">Activo</span>
      </label>
    </div>

    <div class="flex items-center">
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          formControlName="invitado"
          class="sr-only peer"
        />
        <div
          class="w-11 h-6 peer-focus:outline-none peer-focus:ring-2 rounded-full transition-colors"
          style="background-color: var(--hvc-gray-light); --tw-ring-color: var(--hvc-primary)"
        ></div>
        <div
          class="absolute top-1/2 left-0.5 -translate-y-1/2 w-5 h-5 bg-white rounded-full shadow-md transition-transform peer-checked:translate-x-5"
        ></div>
        <span class="ml-3 text-sm font-medium" style="color: var(--text)">Por defecto</span>
      </label>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-end space-x-3 pt-2">
    <button
      type="button"
      (click)="onCancel()"
      class="btn-rol-cancel px-4 py-2 text-sm font-medium rounded-md focus:outline-none focus:ring-2"
    >
      Cancelar
    </button>

    <button
      type="submit"
      [disabled]="isLoading() || form().invalid"
      class="btn-hvc-primary px-4 py-2 text-sm font-medium rounded-md focus:outline-none focus:ring-2 disabled:opacity-50 disabled:cursor-not-allowed"
      style="--tw-ring-color: var(--hvc-primary)"
    >
      {{ btnText }}
    </button>
  </div>
</form>
