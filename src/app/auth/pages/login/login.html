<div class="min-h-screen w-full flex flex-col p-4 bg-primary-dark">

  <!-- Main Content -->
  <div class="main-container flex grow items-center justify-center p-4">

    <!-- CAMBIO: Fondo de la tarjeta a bg-white y sombra acentuada -->
    <div class="box-login w-full max-w-3xl grid grid-cols-1 md:grid-cols-2 rounded-3xl
           relative overflow-hidden bg-white shadow-2xl">

      <!-- Company Logo -->
      <!-- CAMBIO: Se eliminó bg-primary-dark de este contenedor -->
      <div class="flex flex-col items-center justify-center p-10">

        <div class="w-auto h-auto flex items-center justify-center rounded-full">
          <img src="images/hvc_logo.png" class="w-full h-full object-contain" alt="Logo HVC Kapital" />
        </div>

        <!-- CAMBIO: Texto a text-primary-dark para contrastar con el blanco -->
        <h2 class="mt-6 text-2xl font-semibold text-center leading-tight text-primary-dark">
          Panel Administrativo <br />
        </h2>
      </div>

      <!-- Login Form -->
      <div class="p-10 flex flex-col justify-center">

        <!-- CAMBIO: Título principal a text-primary-dark -->
        <h1 class="text-4xl font-bold mb-2 text-primary-dark">Ingreso</h1>
        <p class="text-2xl mb-8 text-gray-light">Accede a tu cuenta</p>

          <!-- Usuario -->
          <!-- CAMBIO: Label a text-primary-light (Azul Grisáceo) -->
          <label class="text-sm font-medium text-primary-light">Usuario</label>
          <!-- CAMBIO: Inputs con bordes y texto oscuro -->
          <input type="text" name="username"
            class="login-input w-full mt-1 mb-6 px-4 py-2 rounded-xl outline-none transition-all border border-gray-light text-primary-dark bg-transparent focus:border-primary focus:ring-1 focus:ring-primary"
            [value]="userName()" (input)="userName.set(txtUserName.value)" #txtUserName>
            
          <!-- Contraseña -->
          <label class="text-sm font-medium text-primary-light">Contraseña</label>
          <div class="relative mt-1 mb-8">
            <input [type]="showPassword() ? 'text' : 'password'" name="password"
              class="login-input w-full pl-4 pr-11 py-2 rounded-xl outline-none transition-all border border-gray-light text-primary-dark bg-transparent focus:border-primary focus:ring-1 focus:ring-primary"
              [value]="password()" (input)="password.set(txtPassword.value)"
              (keydown.enter)="login()"
              #txtPassword >

            <!-- Toggle ver/ocultar contraseña -->
            <button type="button" (click)="showPassword.set(!showPassword())"
              class="absolute inset-y-0 right-0 flex items-center pr-3 transition-colors"
              [class]="showPassword() ? 'text-accent-orange hover:text-accent-gold' : 'text-primary-light hover:text-primary'"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="showPassword()"
              [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              @if (showPassword()) {
              <!-- Ojo tachado: la contraseña está visible -->
              <svg class="pointer-events-none h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" x2="22" y1="2" y2="22" />
              </svg>
              } @else {
              <!-- Ojo abierto: la contraseña está oculta -->
              <svg class="pointer-events-none h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              }
            </button>
          </div>
            
          @if(errorObj().isError) {
          <div class="text-sm text-center text-danger mb-4">
            {{ errorObj().message }}
          </div>
          }
          
          <!-- Botón Ingresar -->
          <!-- CAMBIO: Se aplica la clase btn-hvc-primary de tu CSS -->
          <button type="button"
            class="login-btn w-full py-3 rounded-xl transition-all font-semibold shadow-lg btn-hvc-primary"
            [disabled]="loading()" (click)="login()">
            @if (loading()) {
              <span class="inline-flex items-center justify-center gap-2">
                <svg class="animate-spin h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                Ingresando...
              </span>
            } @else {
              Ingresar
            }
          </button>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <!-- Mantenemos los colores claros aquí porque sigue sobre el fondo oscuro exterior -->
  <footer class="text-center mt-10 mb-4">
    <span class="text-sm sm:text-center text-gray-light">
      © 2026
      <a [routerLink]="['/']" class="hover:underline text-white">KVC Kapital</a>. All Rights Reserved.
    </span>
  </footer>

</div>
